name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build -j2
      - name: C++ CLI smoke check
        run: ./build/microlensing --help
      - name: Python syntax check
        run: python -m py_compile scripts/run_pipeline.py scripts/fourier_minimum.py
      - name: Pipeline CLI smoke check
        run: python scripts/run_pipeline.py --help
