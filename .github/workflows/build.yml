name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build -j2
      - name: C++ CLI smoke check
        run: ./build/microlensing --help
      - name: Python syntax check
        run: >-
          python -m py_compile
          scripts/run_pipeline.py
          scripts/render_outputs.py
          scripts/image_type.py
          scripts/simulation_config.py
          scripts/fourier_minimum.py
          scripts/fourier_saddle.py
          scripts/fourier_maximum.py
      - name: Image type and Morse phase tests
        run: python -m unittest discover -s tests
      - name: Pipeline CLI smoke check
        run: python scripts/run_pipeline.py --help
